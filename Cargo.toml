[workspace]
members = ["crates/mcpack-core", "crates/mcpack-mcp"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
mcpack-core = { path = "crates/mcpack-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "6"
dirs = "5"
regex = "1"
rand = "0.8"
base64 = "0.22"
anyhow = "1"
tempfile = "3"

[profile.release]
lto = "thin"
