// The mcpack agent: a plain Java agent (no mod loader, no Minecraft dependency) loaded with
// -javaagent. It reaches the game by reflection, so one jar serves every loader and version.
plugins {
	id 'java'
}

group = 'dev.mcpack'
version = project.mod_version

java {
	// Old Minecraft versions run on Java 8.
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
	options.compilerArgs += ['-Xlint:-options']
	options.encoding = 'UTF-8'
}

jar {
	archiveBaseName = 'mcpack-agent'
	manifest {
		attributes(
			'Premain-Class': 'dev.mcpack.agent.Boot',
			'Agent-Class': 'dev.mcpack.agent.Boot',
			'Implementation-Title': 'mcpack-agent',
			'Implementation-Version': project.version,
		)
	}
	// Reproducible bytes: the launcher embeds this jar.
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Copy the jar into agent-mod/dist so the Rust launcher can embed it.
tasks.register('dist', Copy) {
	dependsOn jar
	from jar.archiveFile
	into file('dist')
	rename { 'mcpack-agent.jar' }
}
